<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนบาร์โค้ด - IT Asset Management</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Prompt', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .btn { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    .btn-light { background: rgba(255,255,255,0.12); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 16px 24px; }
    #reader { width: 100%; max-width: 520px; border-radius: 16px; overflow: hidden; background: #000; min-height: 240px; }
    #status { margin-top: 16px; text-align: center; font-size: 14px; color: #cbd5e1; white-space: pre-line; }
    #status.error { color: #fda4af; }
  </style>
</head>
<body>
  <header>
    <h1>สแกนบาร์โค้ด / QR</h1>
    <a id="backBtn" class="btn btn-light" href="#">กลับ</a>
  </header>
  <main>
    <div id="reader"></div>
    <p id="status">กำลังเปิดกล้อง...</p>
  </main>

  <script>
    // URL ของเว็บแอป Apps Script ที่จะส่งผลสแกนกลับไป (ส่งมาทางพารามิเตอร์ ?return=...)
    const params = new URLSearchParams(location.search);
    const returnUrl = params.get('return') || '';

    // อนุญาตให้ส่งกลับเฉพาะเว็บแอป Apps Script เท่านั้น (กันการถูกใช้เป็นตัว redirect ไปเว็บอื่น)
    function isAllowedReturn(url) {
      try {
        const u = new URL(url);
        return u.protocol === 'https:' && u.hostname === 'script.google.com';
      } catch (e) {
        return false;
      }
    }

    function setStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = isError ? 'error' : '';
    }

    function goBack(code) {
      const u = new URL(returnUrl);
      if (code) u.searchParams.set('code', code);
      location.replace(u.toString());
    }

    if (!isAllowedReturn(returnUrl)) {
      setStatus('ลิงก์ไม่ถูกต้อง กรุณาเปิดหน้านี้จากปุ่ม "เปิดกล้องสด" ในระบบ', true);
      document.getElementById('backBtn').style.display = 'none';
    } else {
      document.getElementById('backBtn').addEventListener('click', e => { e.preventDefault(); goBack(); });
      startScanner();
    }

    async function startScanner() {
      const F = Html5QrcodeSupportedFormats;
      const scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODABAR, F.ITF, F.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      let handled = false;

      const config = {
        fps: 10,
        qrbox: (w, h) => ({ width: Math.max(50, Math.floor(w * 0.85)), height: Math.max(50, Math.floor(Math.min(w, h) * 0.5)) })
      };

      try {
        await scanner.start({ facingMode: 'environment' }, config, async decodedText => {
          if (handled) return;
          handled = true;
          const code = String(decodedText).trim();
          setStatus(`สแกนสำเร็จ: ${code}\nกำลังกลับไปที่ระบบ...`);
          try { await scanner.stop(); } catch (e) {}
          goBack(code);
        }, () => {});
        setStatus('นำกล้องส่องไปที่บาร์โค้ด/คิวอาร์โค้ด');
      } catch (err) {
        console.error(err);
        setStatus(`เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ แล้วรีเฟรชหน้า\n[${err && err.name ? err.name : err}]`, true);
      }
    }
  </script>
</body>
</html>
