<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนบาร์โค้ด - IT Asset Management</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Prompt', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .btn { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    .btn-light { background: rgba(255,255,255,0.12); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 16px 24px; }
    #reader { width: 100%; max-width: 520px; border-radius: 16px; overflow: hidden; background: #000; min-height: 240px; }
    #status { margin-top: 16px; text-align: center; font-size: 14px; color: #cbd5e1; white-space: pre-line; }
    #status.error { color: #fda4af; }
    #controls { display: none; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
    #controls .btn { padding: 8px 14px; }
    #controls .btn.active { background: #4f46e5; }
    #tips { margin-top: 12px; font-size: 12px; color: #94a3b8; text-align: center; max-width: 520px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>สแกนบาร์โค้ด / QR</h1>
    <a id="backBtn" class="btn btn-light" href="#">กลับ</a>
  </header>
  <main>
    <div id="reader"></div>
    <div id="controls">
      <button class="btn btn-light zoom-btn" data-zoom="1">1x</button>
      <button class="btn btn-light zoom-btn" data-zoom="2">2x</button>
      <button class="btn btn-light zoom-btn" data-zoom="3">3x</button>
      <button class="btn btn-light" id="torchBtn" style="display:none">🔦 ไฟฉาย</button>
    </div>
    <p id="status">กำลังเปิดกล้อง...</p>
    <p id="tips">บาร์โค้ดยาว/แท่งถี่: วางให้แนวนอนเต็มกรอบ ถือห่าง 15–25 ซม. แล้วกดซูม 2x<br>หลีกเลี่ยงแสงสะท้อนบนสติกเกอร์ ถ้ามืดให้เปิดไฟฉาย</p>
  </main>

  <script>
    // URL ของเว็บแอป Apps Script ที่จะส่งผลสแกนกลับไป (ส่งมาทางพารามิเตอร์ ?return=...)
    const params = new URLSearchParams(location.search);
    const returnUrl = params.get('return') || '';

    // อนุญาตให้ส่งกลับเฉพาะเว็บแอป Apps Script เท่านั้น (กันการถูกใช้เป็นตัว redirect ไปเว็บอื่น)
    function isAllowedReturn(url) {
      try {
        const u = new URL(url);
        return u.protocol === 'https:' && u.hostname === 'script.google.com';
      } catch (e) {
        return false;
      }
    }

    function setStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = isError ? 'error' : '';
    }

    function goBack(code) {
      const u = new URL(returnUrl);
      if (code) u.searchParams.set('code', code);
      location.replace(u.toString());
    }

    if (!isAllowedReturn(returnUrl)) {
      setStatus('ลิงก์ไม่ถูกต้อง กรุณาเปิดหน้านี้จากปุ่ม "เปิดกล้องสด" ในระบบ', true);
      document.getElementById('backBtn').style.display = 'none';
    } else {
      document.getElementById('backBtn').addEventListener('click', e => { e.preventDefault(); goBack(); });
      startScanner();
    }

    async function startScanner() {
      const F = Html5QrcodeSupportedFormats;
      const scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODABAR, F.ITF,
                           F.QR_CODE, F.DATA_MATRIX, F.PDF_417, F.AZTEC],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      let handled = false;

      const config = {
        fps: 15,
        // กรอบกว้างเกือบเต็มจอและเตี้ย เหมาะกับบาร์โค้ด 1D ที่ยาว
        qrbox: (w, h) => ({ width: Math.max(50, Math.floor(w * 0.95)), height: Math.max(50, Math.floor(Math.min(w, h) * 0.45)) }),
        // ขอความละเอียดสูง (ค่าเริ่มต้นของเบราว์เซอร์มักต่ำเกินไปสำหรับบาร์โค้ดแท่งถี่) + โฟกัสอัตโนมัติต่อเนื่อง
        videoConstraints: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [{ focusMode: 'continuous' }]
        }
      };

      try {
        await scanner.start({ facingMode: 'environment' }, config, async decodedText => {
          if (handled) return;
          handled = true;
          const code = String(decodedText).trim();
          setStatus(`สแกนสำเร็จ: ${code}\nกำลังกลับไปที่ระบบ...`);
          try { await scanner.stop(); } catch (e) {}
          goBack(code);
        }, () => {});
        setStatus('นำกล้องส่องไปที่บาร์โค้ด/คิวอาร์โค้ด');
        setupCameraControls(scanner);
      } catch (err) {
        console.error(err);
        setStatus(`เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ แล้วรีเฟรชหน้า\n[${err && err.name ? err.name : err}]`, true);
      }
    }

    // ปุ่มซูม/ไฟฉาย (แสดงเฉพาะเมื่อกล้องของเครื่องรองรับ)
    function setupCameraControls(scanner) {
      let caps = {};
      try { caps = scanner.getRunningTrackCapabilities() || {}; } catch (e) { return; }
      const controls = document.getElementById('controls');

      if (caps.zoom) {
        const min = caps.zoom.min || 1, max = caps.zoom.max || 1;
        const buttons = document.querySelectorAll('.zoom-btn');
        buttons.forEach(btn => {
          const z = Number(btn.dataset.zoom);
          if (z > max) { btn.style.display = 'none'; return; }
          btn.addEventListener('click', async () => {
            try {
              await scanner.applyVideoConstraints({ advanced: [{ zoom: Math.max(min, z) }] });
              buttons.forEach(b => b.classList.toggle('active', b === btn));
            } catch (e) { console.error(e); }
          });
        });
        controls.style.display = 'flex';
      } else {
        document.querySelectorAll('.zoom-btn').forEach(b => b.style.display = 'none');
      }

      if (caps.torch) {
        const torchBtn = document.getElementById('torchBtn');
        let on = false;
        torchBtn.style.display = '';
        torchBtn.addEventListener('click', async () => {
          try {
            on = !on;
            await scanner.applyVideoConstraints({ advanced: [{ torch: on }] });
            torchBtn.classList.toggle('active', on);
          } catch (e) { console.error(e); }
        });
        controls.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
